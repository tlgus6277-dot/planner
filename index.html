<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="업무 플래너">
<meta name="theme-color" content="#1e2433">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>업무 플래너</title>
<style>
/* VOICE calm everyday work tool for a social-welfare program officer
   IDEA a Google-Calendar-like wall planner where each program owns a pastel marker
   PICTURE the month grid of pastel task blocks and multi-day bars
   COLOUR white paper, ink band, eight program colours used as pastel fills, tomato only for overdue
   TYPE IBM Plex Sans KR 700 for headings, 400/500 text
   LAYOUT laptop: band, filter bar, calendar 2fr | side 1fr, drawer from the right; phone: stacked, drawer full screen */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#12141a);--ink:light-dark(#1b1d22,#e9eaee);--mute:light-dark(#5d6375,#a0a5b2);--line:light-dark(#e2e5ec,#2a2f3a);--soft:light-dark(#f4f6fa,#181c25);--card:light-dark(#ffffff,#161922);--band:light-dark(#1e2433,#0d1016);--focus:light-dark(#2f5bea,#7d98ff);--hot:light-dark(#d9431c,#ff7b57);--warn:light-dark(#b25a00,#ffb357);
--b0:light-dark(#3b63e6,#7d98ff);--b1:light-dark(#23914f,#5cd08b);--b2:light-dark(#7d4bd9,#b48cff);--b3:light-dark(#11898c,#4fd2cf);--b4:light-dark(#cc3d86,#ff86c0);--b5:light-dark(#d06c00,#ffad4d);--b6:light-dark(#94602f,#d6a274);--b7:light-dark(#647083,#a2acbb)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.pa{--p:color-mix(in srgb,var(--c) 22%,var(--card))}
.band{background:var(--band);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) max(3vw,16px,env(safe-area-inset-right,0px)) 16px max(3vw,16px,env(safe-area-inset-left,0px))}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;max-width:1440px;margin:0 auto}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap;width:100%}
.brand>span{opacity:.75;font-size:14px;font-weight:500}
.seg{display:inline-flex;flex-wrap:wrap;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.seg button{height:38px;padding:0 15px;border:0;border-radius:999px;background:transparent;color:#fff;font-weight:600;cursor:pointer;font-size:15px;white-space:nowrap}
.seg button[aria-pressed=true]{background:#fff;color:#1e2433}
.seg button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.mon{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:clamp(26px,3.6vw,38px);line-height:1.1;letter-spacing:-.02em;margin:0 8px 0 0;white-space:nowrap}
.nav,.today{height:42px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;cursor:pointer;border-radius:21px}
.nav{width:42px;font-size:22px;line-height:1}
.today{padding:0 16px;font-weight:600}
.nav:hover,.today:hover{background:rgba(255,255,255,.12)}
.nav:focus-visible,.today:focus-visible{outline:2px solid #fff;outline-offset:2px}
.stats{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.prog{width:220px}
.pl{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;gap:8px}
.pl b{font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.track{height:8px;border-radius:4px;background:rgba(255,255,255,.22);margin-top:6px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:#fff;border-radius:4px;transition:width .4s ease}
.pill{border-radius:999px;padding:6px 13px;font-size:14px;font-weight:500;white-space:nowrap;background:rgba(255,255,255,.14);border:0;color:#fff}
button.pill{cursor:pointer}
.pill.hot{background:var(--hot);color:#fff}
.fbar{max-width:1440px;margin:0 auto;padding:12px max(3vw,16px) 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fb{height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.fb i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.fb[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fb:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.hd{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);cursor:pointer;white-space:nowrap;min-height:36px;margin-left:auto}
.hd input{width:18px;height:18px;accent-color:var(--ink)}
.wrap{max-width:1440px;margin:0 auto;padding:14px max(3vw,16px) 24px}
.mg{display:grid;grid-template-columns:minmax(0,2.15fr) minmax(0,1fr);gap:20px;align-items:start}
.card{border:1px solid var(--line);border-radius:14px;background:var(--card)}
.pane{padding:16px 18px}
h2{font-size:19px;line-height:1.25;letter-spacing:-.01em;margin:0}
h3{font-size:15px;margin:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.sub{color:var(--mute);font-size:14px;margin:2px 0 10px}
.empty{color:var(--mute);font-size:14px;margin:6px 0}
.wdh{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line)}
.wdh div{padding:8px 8px;font-size:13px;font-weight:600;color:var(--mute)}
.wdh div:first-child{color:var(--hot)}
.wdh div:last-child{color:var(--b0)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line);position:relative}
.wk:last-child{border-bottom:0}
.dc{border-right:1px solid var(--line);cursor:pointer;background:transparent;border-top:0;border-bottom:0;border-left:0;padding:0;margin:0;text-align:left}
.dc:nth-child(7){border-right:0}
.dc.out{background:var(--soft)}
.dc:hover{background:color-mix(in srgb,var(--focus) 5%,var(--card))}
.dc:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.dc.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.dn{display:flex;align-items:center;gap:4px;padding:4px 6px 0;pointer-events:none;font-size:14px;font-weight:600;z-index:1}
.dn .n{width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.dn.out .n{color:var(--mute);font-weight:400}
.dn.sun .n{color:var(--hot)}
.dn.sat .n{color:var(--b0)}
.dn.now .n{background:var(--hot);color:#fff}
.dn svg{width:14px;height:14px;color:var(--mute)}
.ev{position:relative;z-index:1;margin:1px 3px;border-radius:5px;background:var(--p);display:flex;align-items:center;gap:4px;padding:0 6px 0 3px;font-size:13px;line-height:22px;height:22px;overflow:hidden;cursor:pointer;border:0;text-align:left;color:var(--ink);width:calc(100% - 6px);font-weight:500}
.ev.cl{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0;width:calc(100% - 3px)}
.ev.cr{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0;width:calc(100% - 3px)}
.ev.cl.cr{width:100%}
.ev .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.ev .tm{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.ev .mc{font-size:12px;color:var(--mute);display:inline-flex;align-items:center;gap:1px;white-space:nowrap}
.ev .mc svg{width:12px;height:12px}
.ev .u{color:var(--hot);font-weight:800}
.ev.done{opacity:.55}
.ev.done .t{text-decoration:line-through}
.ev.late{box-shadow:inset 0 0 0 1.5px var(--hot)}
.ev:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.cb{flex:none;width:15px;height:15px;border-radius:4px;border:1.5px solid var(--c);background:var(--card);padding:0;cursor:pointer;display:grid;place-items:center}
.cb.on{background:var(--c)}
.cb.on::after,.ck:checked::after{content:"";width:7px;height:4px;border:solid #fff;border-width:0 0 2px 2px;transform:translateY(-1px) rotate(-45deg)}
.cb:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.more{z-index:1;border:0;background:none;color:var(--mute);font-size:13px;font-weight:600;text-align:left;padding:0 8px;cursor:pointer;line-height:20px;height:20px}
.more:hover{color:var(--ink)}
.side{display:grid;gap:16px}
.bz{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;border-top:1px solid var(--line);gap:4px}
.bz:first-child{border-top:0}
.bzm{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 4px 10px 0;cursor:pointer;border-radius:8px}
.bzm:hover .bzt span{text-decoration:underline}
.bzm:focus-visible{outline:2px solid var(--focus)}
.bzt{display:flex;align-items:baseline;gap:8px}
.bzt i{width:12px;height:12px;border-radius:3px;background:var(--c);flex:none;align-self:center}
.bzt span{font-weight:600;flex:1;overflow-wrap:anywhere}
.bzt b{font-size:18px;font-variant-numeric:tabular-nums}
.pbar{position:relative;height:7px;border-radius:4px;background:color-mix(in srgb,var(--c) 16%,var(--soft));margin:6px 0 5px}
.pbar>i{display:block;height:100%;border-radius:4px;background:var(--c);transition:width .4s ease}
.pbar>em{position:absolute;top:-3px;width:2px;height:13px;background:var(--ink);border-radius:1px}
.bzx{font-size:13px;color:var(--mute);display:flex;flex-wrap:wrap;gap:2px 10px}
.hot{color:var(--hot);font-weight:600}
.wrn{color:var(--warn);font-weight:600}
.watch details{border-top:1px solid var(--line)}
.watch details:first-of-type{border-top:0}
.watch summary{display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;font-weight:600;list-style:none}
.watch summary::-webkit-details-marker{display:none}
.watch summary::before{content:"▸";color:var(--mute);font-size:12px;width:12px}
.watch details[open] summary::before{content:"▾"}
.watch summary b{margin-left:auto;font-variant-numeric:tabular-nums;border-radius:999px;padding:1px 10px;background:var(--soft);font-size:14px}
.watch summary b.hot{background:color-mix(in srgb,var(--hot) 14%,transparent)}
.watch .in{padding:0 0 10px}
.tl{list-style:none;margin:0;padding:0}
.ti{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:start;padding:7px 8px;border-radius:8px;background:var(--p);margin-bottom:4px}
.ti.done{opacity:.6}
.ti.done .tt{text-decoration:line-through}
.ti.late{box-shadow:inset 0 0 0 1.5px var(--hot)}
.ti .cb{width:20px;height:20px;margin-top:2px}
.tt{font-weight:500;overflow-wrap:anywhere;cursor:pointer;background:none;border:0;padding:0;text-align:left;width:100%;line-height:1.45}
.tt:hover{text-decoration:underline}
.tt:focus-visible{outline:2px solid var(--focus)}
.meta{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:13px;color:var(--mute);margin-top:2px;align-items:center}
.tag{color:color-mix(in srgb,var(--c) 75%,var(--ink));font-weight:600}
.dd{font-weight:700;font-size:12px;border-radius:4px;padding:0 5px;white-space:nowrap}
.dd.r{background:var(--hot);color:#fff}
.dd.a{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pr{font-size:12px;font-weight:700;white-space:nowrap}
.pr.urgent{color:var(--hot)}
.pr.important{color:var(--warn)}
.stb{font-size:12px;font-weight:600;border-radius:4px;padding:0 6px;background:var(--card);border:1px solid var(--line);white-space:nowrap}
.ia{display:flex;align-items:center;gap:2px}
.ic{width:38px;height:38px;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--mute);display:grid;place-items:center;flex:none}
.ic:hover{background:var(--soft);color:var(--ink)}
.ic:focus-visible{outline:2px solid var(--focus)}
.ic svg{width:18px;height:18px}
.ic.on{color:var(--warn)}
.ic:disabled{opacity:.4}
.sbtn{height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.sbtn:hover{background:var(--soft)}
.sbtn:focus-visible{outline:2px solid var(--focus)}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{font-size:16px;height:42px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);width:100%}
textarea{height:auto;padding:9px 10px;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:2px solid var(--focus);outline-offset:-1px}
label.f{display:grid;gap:3px;font-size:13px;font-weight:600;color:var(--mute)}
.btn{height:42px;padding:0 16px;border-radius:9px;border:0;background:var(--ink);color:var(--bg);font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{opacity:.9}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{height:36px;padding:0 12px;font-size:14px}
.btn.hotb{background:var(--hot);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.qa{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.qa .x{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:8px}
.qa details{grid-column:1/-1}
.qa summary{cursor:pointer;font-size:14px;color:var(--mute);min-height:32px}
.qa .x2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-top:6px}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.sec{margin-top:16px}
.sec>h3{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sec>h3 span{color:var(--mute);font-weight:500;font-size:14px}
.focus3 .ti{background:var(--p);border-left:4px solid var(--c)}
.wkv{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.wcol{border-right:1px solid var(--line);min-height:260px;display:flex;flex-direction:column}
.wcol:last-child{border-right:0}
.wch{display:flex;align-items:baseline;gap:6px;padding:8px 10px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;text-align:left;font-weight:600}
.wch:hover{background:var(--soft)}
.wch.now{background:color-mix(in srgb,var(--hot) 10%,var(--card))}
.wch b{font-size:20px}
.wch.sun{color:var(--hot)}
.wch.sat{color:var(--b0)}
.wch small{margin-left:auto;color:var(--mute);font-weight:500;font-size:12px}
.wcb{padding:6px;display:flex;flex-direction:column;gap:4px}
.wcb .ti{grid-template-columns:auto minmax(0,1fr);padding:5px 6px;font-size:14px;margin:0}
.wcb .ti .cb{width:16px;height:16px}
.wcb .meta{font-size:12px}
.lg{border-bottom:1px solid var(--line);padding:12px 0}
.lg:last-child{border-bottom:0}
.lgh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.lgh i{width:12px;height:12px;border-radius:3px;background:var(--c)}
.lgh h3{font-size:16px}
.lr{display:grid;grid-template-columns:70px minmax(0,1fr);gap:4px 10px;font-size:15px;padding:3px 0}
.lr>span:first-child{font-size:13px;color:var(--mute);font-weight:600;padding-top:2px}
.lr ul{margin:0;padding-left:18px}
.lr li{overflow-wrap:anywhere;white-space:pre-wrap}
.lr li small{color:var(--mute)}
.sumg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:6px 0 14px}
.sumg div{background:var(--soft);border-radius:10px;padding:8px 12px}
.sumg b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.25}
.sumg span{font-size:13px;color:var(--mute)}
.ov{position:fixed;inset:0;background:rgba(10,12,18,.42);z-index:20}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:21;box-shadow:-10px 0 40px rgba(0,0,0,.2);display:flex;flex-direction:column}
.drh{display:flex;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px 16px;border-bottom:1px solid var(--line)}
.drh h2{flex:1;font-size:18px;overflow-wrap:anywhere}
.drb{overflow:auto;padding:16px 18px calc(40px + env(safe-area-inset-bottom,0px));flex:1}
.cbar{height:6px;background:var(--c);border-radius:3px;margin-bottom:12px}
.ttl{font-size:20px;font-weight:700;width:100%;border:1px solid transparent;border-radius:8px;padding:4px 6px;margin-left:-6px;background:transparent;height:auto;line-height:1.35}
.ttl:hover{border-color:var(--line)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.note{font-size:13px;color:var(--mute);margin:4px 0 0}
.lk{border:0;background:none;padding:0;color:var(--focus);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font:inherit;text-align:left}
.logs{list-style:none;margin:8px 0 0;padding:0}
.logs li{border-left:3px solid var(--c);padding:6px 10px;margin-bottom:8px;background:var(--soft);border-radius:0 8px 8px 0}
.logs .lh{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.logs .lh b{color:var(--ink)}
.logs .lh .ia{margin-left:auto}
.logs p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.box{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}
.box>h3{margin-bottom:8px;display:flex;align-items:center;gap:8px}
.box>h3 span{color:var(--mute);font-weight:500}
.tlv{list-style:none;margin:0;padding:0}
.tlv>li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:4px 12px;padding:8px 0;border-bottom:1px solid var(--line)}
.tlv>li:last-child{border-bottom:0}
.tlv time{font-size:13px;font-weight:700;color:var(--c);white-space:nowrap}
.tlv .e{font-size:15px;margin-bottom:4px;overflow-wrap:anywhere;white-space:pre-wrap}
.tlv .k{font-size:12px;font-weight:700;border-radius:4px;padding:0 5px;margin-right:6px;background:var(--soft);color:var(--mute)}
.tlv .k.dec{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tlv .k.don{background:color-mix(in srgb,var(--c) 18%,transparent);color:color-mix(in srgb,var(--c) 75%,var(--ink))}
.phs{list-style:none;margin:0;padding:0}
.phs li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.phs li:last-child{border-bottom:0}
.phs .pn{font-weight:600;overflow-wrap:anywhere}
.phs .pp{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw label{display:block;cursor:pointer}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw span{display:block;width:32px;height:32px;border-radius:50%;background:var(--c);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
.sw input:checked+span{box-shadow:0 0 0 2px var(--ink)}
.sw input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.rep{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px;align-items:start}
.rpo{padding:22px 26px}
.rpo h2{font-size:24px}
.rpo h3{font-size:17px;margin:20px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--ink)}
.rpo h4{font-size:15px;margin:12px 0 4px;display:flex;align-items:center;gap:6px}
.rpo h4 i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.rpo ul{margin:0;padding-left:20px}
.rpo li{margin:3px 0;overflow-wrap:anywhere;white-space:pre-wrap}
.rpo li small{color:var(--mute)}
.rpo table{border-collapse:collapse;width:100%;font-size:14px;margin:6px 0}
.rpo th,.rpo td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.rpo td.n,.rpo th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.status{margin:0;padding:10px 0 0;font-size:13px;color:var(--mute)}
.foot{max-width:1440px;margin:0 auto;padding:0 max(3vw,16px) calc(40px + env(safe-area-inset-bottom,0px))}
.bk{padding:14px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 20px;align-items:center}
.bk h2{font-size:17px}
.bk p{margin:2px 0 0;font-size:14px;color:var(--mute)}
.bk p.warn{color:var(--hot);font-weight:600}
.imp{grid-column:1/-1;background:var(--soft);border-radius:10px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.imp span{flex:1 1 260px;font-size:15px}
.seed{background:var(--soft);border-radius:12px;padding:14px;margin-top:6px}
.seed p{margin:0 0 10px;font-size:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:12px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:10px;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:calc(100% - 32px);z-index:40}
.toast.err{background:var(--hot);color:#fff}
.toast button{height:40px;border:0;background:transparent;color:inherit;font-weight:700;cursor:pointer;padding:0 12px;text-decoration:underline}
@media(max-width:1100px){.mg{grid-template-columns:minmax(0,1fr)}.rep{grid-template-columns:minmax(0,1fr)}}
@media(max-width:900px){.wkv{grid-template-columns:minmax(0,1fr)}.wcol{border-right:0;border-bottom:1px solid var(--line);min-height:0}.wcol:last-child{border-bottom:0}.cols2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:700px){.bk{grid-template-columns:minmax(0,1fr)}.kv,.g3,.qa .x,.qa .x2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media(max-width:600px){.stats{margin-left:0;width:100%}.prog{flex:1 1 100%;width:auto}.ev{height:9px;line-height:9px;padding:0;margin:1px 1px;width:calc(100% - 2px)}.ev *{display:none!important}.dn{justify-content:center;padding:3px 0 0}.dn svg{display:none}.more{font-size:12px;padding:0 3px}.wdh div{text-align:center;padding:8px 2px}.pane,.drb{padding:14px}.lr{grid-template-columns:minmax(0,1fr)}.tlv>li{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){.track i,.pbar>i{transition:none}}
</style>
</head>
<body>
<header class="band">
  <div class="bar">
    <div class="brand"><span>업무 플래너</span><div class="seg" role="group" aria-label="화면 선택"><button type="button" data-view="day" aria-pressed="false">일간</button><button type="button" data-view="week" aria-pressed="false">주간</button><button type="button" data-view="month" aria-pressed="true">월간</button><button type="button" data-view="log" aria-pressed="false">업무일지</button><button type="button" data-view="rep" aria-pressed="false">업무보고</button></div></div>
    <div class="mon">
      <h1 id="h1">이번 달</h1>
      <span id="navs"><button type="button" class="nav" id="prev" aria-label="이전">‹</button>
      <button type="button" class="nav" id="next" aria-label="다음">›</button>
      <button type="button" class="today" id="goToday">오늘</button></span>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</header>
<div class="fbar" id="fbar"></div>
<div class="wrap">
  <section id="vMonth" hidden>
    <div class="mg">
      <div class="card" aria-label="월간 달력">
        <div class="wdh"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
        <div id="grid"></div>
      </div>
      <div class="side">
        <section class="card pane" aria-labelledby="bzT"><div class="ph"><h2 id="bzT">세부사업 추진 현황</h2><button type="button" class="btn ghost sm" data-act="bizform">+ 세부사업</button></div><div id="bzList"></div></section>
        <section class="card pane watch" aria-labelledby="wT"><h2 id="wT" style="margin-bottom:4px">놓치지 말 것</h2><div id="watch"></div></section>
        <p class="status" id="status">불러오는 중…</p>
      </div>
    </div>
  </section>
  <section id="vWeek" hidden></section>
  <section id="vDay" hidden></section>
  <section id="vLog" hidden></section>
  <section id="vRep" hidden></section>
</div>
<footer class="foot">
  <section class="card bk" aria-label="백업">
    <div><h2>백업</h2><p id="bkInfo">세부사업, 할 일, 메모를 파일로 내려받아 두세요.</p></div>
    <div class="row">
      <button type="button" class="btn" id="bkJson">백업 파일 내려받기</button>
      <button type="button" class="btn ghost" id="bkCsv">엑셀용 목록 내려받기</button>
      <button type="button" class="btn ghost" id="bkCopy" hidden>백업 내용 복사</button>
      <button type="button" class="btn ghost" id="bkLoad">백업 불러오기</button>
      <input type="file" id="bkFile" accept=".json,application/json" hidden>
    </div>
    <div class="imp" id="imp" hidden><span id="impMsg"></span><button type="button" class="btn" id="impOk">지금 내용에 합치기</button><button type="button" class="btn ghost" id="impNo">취소</button></div>
  </section>
</footer>
<div class="ov" id="ov" hidden></div>
<aside class="dr" id="dr" hidden role="dialog" aria-modal="true" aria-labelledby="drT">
  <div class="drh"><button type="button" class="ic" id="drBack" aria-label="뒤로" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button><h2 id="drT"></h2><button type="button" class="ic" id="drClose" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="drb" id="drB"></div>
</aside>
<div class="toast" id="toast" hidden role="status"><span id="tMsg"></span><button type="button" id="tUndo">되돌리기</button></div>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const isDay=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s);
const parse=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const WD=['일','월','화','수','목','금','토'];
const PAL=['b0','b1','b2','b3','b4','b5','b6','b7'];
const PALN={b0:'파랑',b1:'초록',b2:'보라',b3:'청록',b4:'분홍',b5:'주황',b6:'갈색',b7:'회색'};
const PRI={urgent:'긴급',important:'중요',normal:'일반'};
const PRO={urgent:0,important:1,normal:2};
const ST={plan:'예정',doing:'진행 중',review:'검토 중',wait:'대기',done:'완료'};
const DEFPH=['사업계획 수립','내부 기안','홍보','참여자 모집','선정','사업 운영','정산','결과보고'];
const col=k=>PAL.includes(k)?k:'b7';
const cv=k=>'--c:var(--'+col(k)+')';
const SV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
const IC={
  edit:SV+'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>',
  del:SV+'<path d="M4 7h16M10 7V4h4v3M6 7l1 13h10l1-13"/></svg>',
  note:SV+'<path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/></svg>',
  star:SV+'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
  starf:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
  up:SV+'<path d="M6 15l6-6 6 6"/></svg>',
  dn:SV+'<path d="M6 9l6 6 6-6"/></svg>',
  gcal:SV+'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></svg>',
  gok:SV+'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M9 15.5l2 2 4-4"/></svg>'
};
const K=['biz','items','days','bnotes'];
const S={biz:{},items:{},days:{},bnotes:{}};
const today=()=>ymd(new Date());
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const addDays=(k,n)=>{const d=parse(k);return ymd(new Date(d.getFullYear(),d.getMonth(),d.getDate()+n))};
const dayN=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const label=k=>{const d=parse(k);return (d.getMonth()+1)+'월 '+d.getDate()+'일 '+WD[d.getDay()]+'요일'};
const short=k=>{if(!isDay(k))return '';const d=parse(k);return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')'};
const isoDay=v=>{if(!v)return '';const d=new Date(v);return isNaN(d)?'':ymd(d)};
const hm=v=>{const d=new Date(v);return isNaN(d)?'':pad(d.getHours())+':'+pad(d.getMinutes())};
const weekStart=k=>{const d=parse(k),w=(d.getDay()+6)%7;return addDays(k,-w)};
let hideDone=false;try{hideDone=localStorage.getItem('wp2-hide')==='1'}catch(e){}

/* ---------- data access (compatible with v2: same keys, fields only added) ---------- */
function nItem(id,t){
  const date=isDay(t.date)?t.date:'',end=date&&isDay(t.end)&&t.end>date?t.end:'',done=!!t.done;
  let status=ST[t.status]?t.status:(done?'done':'plan');if(done)status='done';else if(status==='done')status='doing';
  const logs=(Array.isArray(t.logs)?t.logs:[]).filter(l=>l&&typeof l==='object').map((l,i)=>({id:String(l.id||('l'+i)),at:String(l.at||''),date:isDay(l.date)?l.date:isoDay(l.at),text:String(l.text||'')}));
  return {id,biz:String(t.biz||''),title:String(t.title||'제목 없음'),date,end,time:/^\d{2}:\d{2}$/.test(t.time||'')?t.time:'',due:isDay(t.due)?t.due:'',prio:PRI[t.prio]?t.prio:'normal',status,done,doneAt:String(t.doneAt||''),createdAt:Number(t.createdAt)||0,phase:String(t.phase||''),parent:String(t.parent||''),origDate:isDay(t.origDate)?t.origDate:'',origDue:isDay(t.origDue)?t.origDue:'',carried:Number(t.carried)||0,focus:isDay(t.focus)?t.focus:'',logs,gcal:t.gcal};
}
const items=()=>Object.entries(S.items).filter(([,t])=>t&&typeof t==='object').map(([id,t])=>nItem(id,t));
const item=id=>S.items[id]&&typeof S.items[id]==='object'?nItem(id,S.items[id]):null;
const bizList=()=>Object.entries(S.biz).filter(([,b])=>b&&typeof b==='object').map(([id,b])=>({id,name:String(b.name||'이름 없는 사업'),color:col(b.color),start:isDay(b.start)?b.start:'',end:isDay(b.end)?b.end:'',createdAt:Number(b.createdAt)||0,phases:(Array.isArray(b.phases)?b.phases:[]).filter(p=>p&&typeof p==='object').map((p,i)=>({id:String(p.id||'p'+i),name:String(p.name||'')})),perf:(Array.isArray(b.perf)?b.perf:[]).filter(p=>p&&typeof p==='object').map((p,i)=>({id:String(p.id||'f'+i),label:String(p.label||''),target:Number(p.target)||0,actual:Number(p.actual)||0,unit:String(p.unit||'')}))})).sort((a,b)=>a.createdAt-b.createdAt);
function bizMap(){const m={};bizList().forEach((b,i)=>{m[b.id]={...b,i}});return m}
const notes=()=>Object.entries(S.bnotes).filter(([,n])=>n&&typeof n==='object').map(([id,n])=>({id,biz:String(n.biz||''),date:isDay(n.date)?n.date:'',body:String(n.body||''),kind:n.kind==='decision'?'decision':'note',createdAt:Number(n.createdAt)||0}));
const eEnd=t=>t.end||t.date;
const dueOf=t=>t.due||eEnd(t);
const isLate=(t,ref)=>!t.done&&!!t.date&&eEnd(t)<(ref||today());
const isOver=(t,ref)=>!t.done&&!!dueOf(t)&&dueOf(t)<(ref||today());
const doneDay=t=>t.done?(isoDay(t.doneAt)||eEnd(t)):'';
const onDay=(t,d)=>!!t.date&&t.date<=d&&eEnd(t)>=d;
const overlaps=(t,a,b)=>!!t.date&&t.date<=b&&eEnd(t)>=a;
const byPrio=(a,b)=>(a.done-b.done)||(PRO[a.prio]-PRO[b.prio])||((a.time||'99')<(b.time||'99')?-1:(a.time||'99')>(b.time||'99')?1:0)||(a.createdAt-b.createdAt);
function ddBadge(t){if(t.done||!t.due)return '';const n=dayN(today(),t.due);if(n<0)return '<span class="dd r">마감 D+'+(-n)+'</span>';if(n===0)return '<span class="dd r">마감 D-day</span>';if(n<=7)return '<span class="dd a">마감 D-'+n+'</span>';return '<span class="dd" style="color:var(--mute)">마감 '+short(t.due)+'</span>'}

/* ---------- store ---------- */
const pend=[];
let store={put(k,i,o){S[k][i]=o;pend.push([k,i,o]);render()},del(k,i){delete S[k][i];pend.push([k,i,null]);render()}};
const setStatus=t=>{const e=$('#status');if(e)e.textContent=t};
let tt=null,undo=null;
function toast(msg,canUndo,err){$('#tMsg').textContent=msg;$('#tUndo').hidden=!canUndo;const t=$('#toast');t.classList.toggle('err',!!err);t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{t.hidden=true;undo=null},err?9000:6500)}
function putItem(id,patch){const raw=S.items[id];if(!raw)return;store.put('items',id,{...raw,...patch})}
function setDone(id,v){const t=item(id);if(!t)return;putItem(id,{done:v,doneAt:v?new Date().toISOString():'',status:v?'done':(t.status==='done'?'doing':t.status)})}
function setSt(id,s){if(s==='done')return setDone(id,true);const t=item(id);if(!t)return;putItem(id,{status:s,done:false,doneAt:''})}
function carry(id,to){const t=item(id);if(!t||!isDay(to)||to===t.date)return;const span=t.end?dayN(t.date,t.end):0;putItem(id,{date:to,end:span?addDays(to,span):'',origDate:t.origDate||t.date||'',carried:t.date?t.carried+1:t.carried})}
function setDue(id,v){const t=item(id);if(!t)return;const nv=isDay(v)?v:'';if(nv===t.due)return;putItem(id,{due:nv,origDue:t.origDue||(t.due&&t.due!==nv?t.due:'')})}
function newItem(o){const id=nid();store.put('items',id,{biz:o.biz,title:String(o.title).slice(0,200),date:isDay(o.date)?o.date:'',end:isDay(o.end)&&o.end>o.date?o.end:'',time:o.time||'',due:isDay(o.due)?o.due:'',prio:PRI[o.prio]?o.prio:'normal',status:'plan',done:false,doneAt:'',phase:o.phase||'',parent:o.parent||'',logs:[],createdAt:Date.now()});return id}
function delItem(id){const raw=S.items[id];if(!raw)return;store.del('items',id);undo=[['items',id,raw]];toast('할 일을 지웠어요. 처리 기록도 함께 지워졌어요.',true)}

/* ---------- view state ---------- */
const VIEWS=['day','week','month','log','rep'];
let view=VIEWS.includes(location.hash.slice(1))?location.hash.slice(1):'month';
let cur=today(),filter='',stack=[],logEdit=null,nEdit=null,lastBiz='',pendingRender=false,refocus=null;
const rp={type:'week',from:'',to:'',biz:''};
const typing=()=>{const a=document.activeElement;return !!a&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&/^(text|search|number)$/.test(a.type)))&&!!a.value};
function put(el,html){if(!el)return;if(el.contains(document.activeElement)&&typing()){pendingRender=true;return}el.innerHTML=html}
document.addEventListener('focusout',()=>{if(pendingRender){pendingRender=false;setTimeout(()=>{if(!typing())render()},0)}});
const flt=list=>filter?list.filter(t=>t.biz===filter):list;
const visL=list=>hideDone?list.filter(t=>!t.done):list;

/* ---------- shared pieces ---------- */
function bizOpts(bl,v,blank){return (blank?'<option value="">'+blank+'</option>':'')+bl.map(b=>'<option value="'+esc(b.id)+'"'+(b.id===v?' selected':'')+'>'+esc(b.name)+'</option>').join('')}
function tiHtml(t,bm,o){
  o=o||{};const b=bm[t.biz],c=b?b.color:'b7',late=isLate(t),over=isOver(t);
  const meta=[];
  if(o.biz!==false)meta.push('<span class="tag">'+esc(b?b.name:'세부사업 없음')+'</span>');
  if(o.date&&t.date)meta.push('<span>'+short(t.date)+(t.end?' ~ '+short(t.end):'')+'</span>');
  if(t.time)meta.push('<span>'+t.time+'</span>');
  if(t.prio!=='normal')meta.push('<span class="pr '+t.prio+'">'+PRI[t.prio]+'</span>');
  if(!t.done&&t.status!=='plan')meta.push('<span class="stb">'+ST[t.status]+'</span>');
  const dd=ddBadge(t);if(dd)meta.push(dd);
  if(late&&!over)meta.push('<span class="wrn">이월 필요</span>');
  if(t.carried)meta.push('<span>이월 '+t.carried+'회</span>');
  if(t.logs.length)meta.push('<span>'+IC.note.replace('<svg','<svg width="13" height="13" style="vertical-align:-2px"')+' '+t.logs.length+'</span>');
  if(t.done&&doneDay(t))meta.push('<span>'+short(doneDay(t))+' 완료</span>');
  const acts=(o.star?'<button type="button" class="ic'+(t.focus===o.star?' on':'')+'" data-act="star" data-id="'+esc(t.id)+'" aria-label="'+(t.focus===o.star?'핵심 업무에서 빼기':'오늘의 핵심 업무로 지정')+'" title="핵심 업무">'+(t.focus===o.star?IC.starf:IC.star)+'</button>':'')+(o.carry&&!t.done?'<button type="button" class="sbtn" data-act="carry" data-id="'+esc(t.id)+'" data-to="'+o.carry+'">'+(o.carry===today()?'오늘로':short(o.carry)+'로')+'</button>':'');
  return '<li class="ti pa'+(t.done?' done':'')+(over?' late':'')+'" style="'+cv(c)+'"><button type="button" class="cb'+(t.done?' on':'')+'" data-act="tog" data-id="'+esc(t.id)+'" aria-label="'+esc(t.title)+(t.done?' 완료 취소':' 완료')+'"></button><div><button type="button" class="tt" data-act="task" data-id="'+esc(t.id)+'">'+esc(t.title)+'</button><div class="meta">'+meta.join('')+'</div></div>'+(acts?'<div class="ia">'+acts+'</div>':'<span></span>')+'</li>';
}
function quickAdd(pre,date,bl,opt){
  opt=opt||{};const want=filter||lastBiz;const bz=bl.some(b=>b.id===want)?want:(bl[0]?bl[0].id:'');
  if(!bl.length)return '<p class="empty">세부사업을 먼저 만들어 주세요. <button type="button" class="lk" data-act="bizform">세부사업 만들기</button></p>';
  return '<form class="qa" data-qa="'+pre+'"><input type="text" name="title" id="'+pre+'-t" placeholder="'+(opt.ph||'할 일 추가')+'" aria-label="할 일" maxlength="200"><button class="btn">추가</button><div class="x"><select name="biz" aria-label="세부사업">'+bizOpts(bl,bz)+'</select><input type="date" name="date" value="'+(date||'')+'" aria-label="예정일 (비우면 날짜 미정)"><select name="prio" aria-label="우선순위"><option value="normal">일반</option><option value="important">중요</option><option value="urgent">긴급</option></select></div><details><summary>기간·마감일·시간 더 넣기</summary><div class="x2"><label class="f">종료일 (여러 날)<input type="date" name="end"></label><label class="f">마감일<input type="date" name="due"></label><label class="f">시간<input type="time" name="time"></label></div></details></form>';
}

/* ---------- header & filter ---------- */
function renderHead(list){
  const h=$('#h1'),d=parse(cur);
  for(const b of document.querySelectorAll('.seg button'))b.setAttribute('aria-pressed',String(b.dataset.view===view));
  $('#navs').hidden=view==='rep';
  let st='';
  if(view==='month'){
    h.textContent=d.getFullYear()+'년 '+(d.getMonth()+1)+'월';

function dayLogs(D,list,bm){

  const bn=notes().filter(n=>n.date===D&&(!bid||n.biz===bid));
  const ids=new Set([...planned,...done,...follow].map(t=>t.biz).concat(logs.map(x=>x.t.biz)).concat(bn.map(n=>n.biz)));
  const groups=[...bizList().filter(b=>ids.has(b.id)),...(([...ids].some(i=>!bm[i]))?[{id:'__none',name:'세부사업 없음',color:'b7'}]:[])].map(b=>{const m=x=>b.id==='__none'?!bm[x]:x===b.id;return {b,planned:planned.filter(t=>m(t.biz)),done:done.filter(t=>m(t.biz)),open:open.filter(t=>m(t.biz)),follow:follow.filter(t=>m(t.biz)),logs:logs.filter(x=>m(x.t.biz)),notes:bn.filter(n=>m(n.biz))}});

}

/* ---------- drawer ---------- */
function openD(o,reset){if(reset)stack=[];const top=stack[stack.length-1];if(!top||JSON.stringify(top)!==JSON.stringify(o))stack.push(o);$('#dr').hidden=false;$('#ov').hidden=false;logEdit=null;nEdit=null;render();setTimeout(()=>{const f=$('#drB [autofocus]')||$('#drClose');if(f)f.focus()},30)}
function closeD(){stack=[];$('#dr').hidden=true;$('#ov').hidden=true;render()}
function backD(){stack.pop();if(!stack.length)return closeD();logEdit=null;nEdit=null;render()}
function renderDrawer(list,bl,bm){
  if(!stack.length)return;
  const top=stack[stack.length-1];$('#drBack').hidden=stack.length<2;
  let ttl='',h='';
  if(top.t==='day'){const D=top.d;ttl=label(D)+(D===today()?' · 오늘':'');const arr=visL(flt(list).filter(t=>onDay(t,D))).sort(byPrio);
    h=quickAdd('drd',D,bl,{ph:'이날 할 일 추가'})+'<ul class="tl" style="margin-top:12px">'+arr.map(t=>tiHtml(t,bm,{})).join('')+'</ul>'+(arr.length?'':'<p class="empty">계획된 업무가 없어요</p>')+'<div class="box"><h3>이날 업무일지</h3>'+journalHtml(journalData(D,list,bm,filter),bm)+'<button type="button" class="lk" data-act="golog" data-d="'+D+'">업무일지 화면에서 크게 보기</button></div><div class="box"><h3>이날 메모</h3><textarea id="dayMemo" rows="4" placeholder="회의 내용, 통화 내용, 그날의 특이사항">'+esc((S.days[D]&&S.days[D].text)||'')+'</textarea><p class="note" id="memoState"></p></div>';}
  else if(top.t==='task'){const t=item(top.id);if(!t){h='<p class="empty">지워진 할 일이에요.</p>';ttl='할 일'}else{ttl='할 일 상세';h=taskHtml(t,bl,bm,list)}}
  else if(top.t==='biz'){const b=bl.find(x=>x.id===top.id);if(!b){h='<p class="empty">지워진 세부사업이에요.</p>';ttl='세부사업'}else{ttl='세부사업 추진 현황';h=bizHtml(b,list,bm)}}
  else if(top.t==='bizform'){const b=top.id?bl.find(x=>x.id===top.id):null;ttl=b?'세부사업 수정':'새 세부사업';h=bizFormHtml(b,bl)}
  $('#drT').textContent=ttl;put($('#drB'),h);

function rpRange(){
  const td=cur,y=td.slice(0,4),b=rp.biz?bizList().find(x=>x.id===rp.biz):null;
  if(rp.type==='day')return [td,td];

  if(!d||typeof d!=='object'||d.app!=='work-planner'){toast('업무 플래너 백업 파일이 아니에요.',false,true);return}
  if(d.version!==2&&d.version!==3){toast('예전 버전(1)의 백업 파일이라 불러올 수 없어요.',false,true);return}
  const imp={};for(const k of K){imp[k]={};const src=d[k];if(src&&typeof src==='object'&&!Array.isArray(src))for(const [id,v] of Object.entries(src))if(okId(id)&&v&&typeof v==='object'&&!Array.isArray(v)&&(k!=='days'||isDay(id)))imp[k][id]=v}
  pendingImp=imp;const c=k=>Object.keys(imp[k]).length;
  $('#impMsg').textContent='이 파일에 세부사업 '+c('biz')+'개, 할 일 '+c('items')+'개, 사업 메모 '+c('bnotes')+'개, 날짜 메모 '+c('days')+'개가 있어요. 지금 내용은 그대로 두고, 같은 항목은 파일 내용으로 바꿔요.';
  $('#imp').hidden=false;$('#imp').scrollIntoView({block:'nearest'});
});
$('#impNo').addEventListener('click',()=>{pendingImp=null;$('#imp').hidden=true});
$('#impOk').addEventListener('click',()=>{if(!pendingImp)return;let n=0;for(const k of K)for(const [id,v] of Object.entries(pendingImp[k])){store.put(k,id,v);n++}pendingImp=null;$('#imp').hidden=true;toast(n+'개 항목을 불러왔어요.',false)});

/* ---------- storage boot ---------- */
function useLocal(){
  const LK='work-planner-v2';let raw=null,d={};
  try{raw=localStorage.getItem(LK);d=JSON.parse(raw||'{}')||{}}catch(e){d={}}
  try{if(raw&&!localStorage.getItem('work-planner-v2-before-v3'))localStorage.setItem('work-planner-v2-before-v3',raw)}catch(e){}
  for(const k of K)S[k]=d[k]&&typeof d[k]==='object'?d[k]:{};
  let warned=false;
  const save=()=>{try{localStorage.setItem(LK,JSON.stringify(S));warned=false}catch(e){if(!warned){warned=true;toast('저장하지 못했어요. 저장 공간이 부족하거나 브라우저가 저장을 막고 있어요. 지금 바로 백업 파일을 내려받아 주세요.',false,true)}}};
  store={put(k,i,o){S[k][i]=o;save();render()},del(k,i){delete S[k][i];save();render()}};
  for(const [k,i,o] of pend.splice(0))o?store.put(k,i,o):store.del(k,i);
  const standalone=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
  setStatus(inClaude()?'지금은 이 브라우저에만 저장돼요. claude.ai에 로그인한 상태로 열면 계정에 저장돼요.':(standalone?'이 기기에 저장돼요. 인터넷 없이도 쓸 수 있어요. 백업은 자주 내려받아 두세요.':'이 브라우저에 저장돼요. 기록을 지우면 함께 지워지니 백업을 자주 내려받아 두세요.'));render();
}
async function boot(){
  render();
  if(inClaude()){window.claude.use('mcp').then(m=>{mcp=m;gOK=!!m;if(gOK)render()}).catch(()=>{});window.claude.use('downloads').then(x=>{dl=x;if(!dl)$('#bkCopy').hidden=false}).catch(()=>{$('#bkCopy').hidden=false})}
  let db=null,id=null;
  try{if(inClaude()){db=await window.claude.use('db');const u=db?await window.claude.use('user'):null;id=u?await u.id():null}}catch(e){db=null}
  if(!db||!id){useLocal();return}
  const base=db.doc('data/users/'+id+'/planner2'),cols={},chains={};
  for(const k of K)cols[k]=base.collection(k);
  const enq=(key,fn)=>{chains[key]=(chains[key]||Promise.resolve()).then(fn).catch(err=>{const c=err&&err.code;toast(c==='quota_exceeded'?'저장 공간이 가득 찼어요. 오래된 항목을 지워 주세요.':c==='invalid_argument'?'저장하지 못했어요. 이 페이지의 편집 권한을 확인해 주세요.':'저장하지 못했어요. 잠시 뒤 다시 해 주세요.',false,true)})};
  store={put(k,i,o){S[k][i]=o;render();enq(k+'/'+i,()=>cols[k].doc(i).set(o))},del(k,i){delete S[k][i];render();enq(k+'/'+i,()=>cols[k].doc(i).delete())}};
  for(const [k,i,o] of pend.splice(0))o?store.put(k,i,o):store.del(k,i);
  const seen={};const timer=setTimeout(()=>setStatus('저장소에 아직 연결되지 않았어요. 보이는 내용이 최신이 아닐 수 있어요.'),10000);
  for(const k of K){cols[k].onSnapshot(snap=>{const o={};for(const d of snap.docs)o[d.id]=d.data();S[k]=o;if(!snap.metadata.fromCache&&!seen[k]){seen[k]=1;if(Object.keys(seen).length===K.length){clearTimeout(timer);setStatus('내 계정에 저장돼요. 어느 컴퓨터에서 이 링크를 열어도 그대로 보여요.')}}render()},()=>{clearTimeout(timer);setStatus('저장소 연결이 끊겼어요. 페이지를 다시 열어 주세요.')})}
}
if('serviceWorker' in navigator&&!inClaude()&&(location.protocol==='https:'||location.hostname==='localhost'))fetch('sw.js',{method:'HEAD'}).then(r=>{if(r.ok)navigator.serviceWorker.register('sw.js').catch(()=>{})}).catch(()=>{});
try{if(!inClaude()&&navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
boot();
}
</script>
